name: Project 08 scRNA-seq checks

on:
  push:
    paths:
      - "projects/08_single_cell_rnaseq/**"
      - ".github/workflows/project-08-scrnaseq.yml"
  pull_request:
    paths:
      - "projects/08_single_cell_rnaseq/**"
      - ".github/workflows/project-08-scrnaseq.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-unit-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/08_single_cell_rnaseq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile scripts
        run: python -m compileall -q scripts tests
      - name: Validate analysis configuration JSON
        run: python -m json.tool config/analysis.json > /dev/null
      - name: Run validator tests
        run: python -m unittest discover -s tests -v

  cloud-analysis:
    # Run the data-dependent workflow on pushes to the default branch, not on PRs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: projects/08_single_cell_rnaseq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: projects/08_single_cell_rnaseq/requirements.txt
      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Download public PBMC 3k dataset
        run: python scripts/download_data.py
      - name: Validate downloaded matrix
        run: python scripts/validate_inputs.py --input data/raw/filtered_gene_bc_matrices/hg19
      - name: Run Scanpy workflow
        run: python scripts/run_analysis.py --config config/analysis.json --input data/raw/filtered_gene_bc_matrices/hg19 --output results
      - name: Upload analysis outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-08-scrnaseq-results
          path: projects/08_single_cell_rnaseq/results/
          if-no-files-found: warn
          retention-days: 14

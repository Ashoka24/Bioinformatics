name: Project 06 RNA-seq

on:
  push:
    paths:
      - "rnaseq-differential-expression/scripts/**"
      - "rnaseq-differential-expression/metadata/**"
      - "rnaseq-differential-expression/README.md"
      - ".github/workflows/project06_rnaseq.yml"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: project06-rnaseq-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rnaseq:
    runs-on: ubuntu-latest
    container:
      image: bioconductor/bioconductor_docker:RELEASE_3_20

    steps:
      - uses: actions/checkout@v4

      - name: Install analysis packages
        run: |
          Rscript -e 'BiocManager::install("DESeq2", ask=FALSE, update=FALSE)'
          Rscript -e 'install.packages(c("ggplot2","svglite"), repos="https://cloud.r-project.org")'

      - name: Verify analysis environment
        run: Rscript -e 'library(DESeq2); library(ggplot2); cat("DESeq2:", as.character(packageVersion("DESeq2")), "\n")'

      - name: Run RNA-seq analysis
        working-directory: rnaseq-differential-expression
        run: Rscript scripts/run_deseq2.R

      - name: Commit compact summary outputs
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rnaseq-differential-expression/results/REPORT.md rnaseq-differential-expression/results/metrics.tsv
          if git diff --cached --quiet; then
            echo "No summary changes to commit"
          else
            git commit -m "results: refresh paired RNA-seq summary"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                exit 0
              fi
              if [ "$attempt" -lt 3 ]; then
                git fetch origin main
                git rebase origin/main
              fi
            done
            echo "Could not push paired RNA-seq summary after three attempts." >&2
            exit 1
          fi

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: project06-rnaseq-results
          path: rnaseq-differential-expression/results/

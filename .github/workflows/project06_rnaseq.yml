name: Project 06 RNA-seq

on:
  workflow_dispatch:

jobs:
  rnaseq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"

      - name: Install Bioconductor packages
        run: |
          Rscript -e 'install.packages("BiocManager", repos="https://cloud.r-project.org")'
          Rscript -e 'BiocManager::install("DESeq2", ask=FALSE, update=FALSE)'
          Rscript -e 'install.packages("ggplot2", repos="https://cloud.r-project.org")'

      - name: Run RNA-seq analysis
        working-directory: projects/06_rnaseq_differential_expression
        run: Rscript scripts/run_deseq2.R

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: project06-rnaseq-results
          path: projects/06_rnaseq_differential_expression/results/

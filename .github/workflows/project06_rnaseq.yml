name: Project 06 RNA-seq

on:
  push:
    paths:
      - "projects/06_rnaseq_differential_expression/**"
      - ".github/workflows/project06_rnaseq.yml"
    branches:
      - main
  workflow_dispatch:

jobs:
  rnaseq:
    runs-on: ubuntu-latest
    container:
      image: bioconductor/bioconductor_docker:RELEASE_3_20

    steps:
      - uses: actions/checkout@v4

      - name: Install analysis packages
        run: |
          python -m pip install --no-cache-dir pysradb
          Rscript -e 'BiocManager::install("DESeq2", ask=FALSE, update=FALSE)'
          Rscript -e 'if (!requireNamespace("ggplot2", quietly=TRUE)) install.packages("ggplot2", repos="https://cloud.r-project.org")'

      - name: Verify analysis environment
        run: Rscript -e 'library(DESeq2); library(ggplot2); cat("DESeq2:", as.character(packageVersion("DESeq2")), "\n")'

      - name: Run RNA-seq analysis
        working-directory: projects/06_rnaseq_differential_expression
        run: Rscript scripts/run_deseq2.R

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: project06-rnaseq-results
          path: projects/06_rnaseq_differential_expression/results/

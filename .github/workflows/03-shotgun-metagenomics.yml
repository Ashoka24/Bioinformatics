name: 03 - Shotgun metagenomics

on:
  workflow_dispatch:
  push:
    paths:
      - "shotgun-metagenomics/scripts/**"
      - "shotgun-metagenomics/README.md"
      - "shotgun-metagenomics/metadata/DATASET.md"

concurrency:
  group: project03-shotgun-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shotgun:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fastp kraken2 centrifuge curl

      - name: Run public shotgun analysis
        run: bash shotgun-metagenomics/scripts/run_shotgun.sh

      - name: Verify derived results
        run: |
          test -s shotgun-metagenomics/results/run_metadata.tsv
          test -s shotgun-metagenomics/results/fastp_summary.json
          test -s shotgun-metagenomics/results/kraken2.report
          test -s shotgun-metagenomics/results/top_taxa.tsv
          test -s shotgun-metagenomics/results/centrifuge.report.tsv
          test -s shotgun-metagenomics/results/classifier_comparison.tsv
          test -s shotgun-metagenomics/results/CLASSIFIER_COMPARISON.md
          test -s shotgun-metagenomics/results/REPORT.md
          test ! -e shotgun-metagenomics/results/centrifuge.classification.tsv

      - name: Upload verified results
        uses: actions/upload-artifact@v4
        with:
          name: project03-shotgun-results
          path: shotgun-metagenomics/results/
          if-no-files-found: error
          retention-days: 90

name: 03 - Shotgun metagenomics

on:
  workflow_dispatch:
  push:
    paths:
      - "projects/03_shotgun_metagenomics/**"
      - ".github/workflows/03-shotgun-metagenomics.yml"

jobs:
  shotgun:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fastp kraken2 centrifuge curl

      - name: Run public shotgun analysis
        run: bash projects/03_shotgun_metagenomics/scripts/run_shotgun.sh

      - name: Verify derived results
        run: |
          test -s projects/03_shotgun_metagenomics/results/run_metadata.tsv
          test -s projects/03_shotgun_metagenomics/results/fastp_summary.json
          test -s projects/03_shotgun_metagenomics/results/kraken2.report
          test -s projects/03_shotgun_metagenomics/results/top_taxa.tsv
          test -s projects/03_shotgun_metagenomics/results/centrifuge.report.tsv
          test -s projects/03_shotgun_metagenomics/results/centrifuge.classification.tsv
          test -s projects/03_shotgun_metagenomics/results/classifier_comparison.tsv
          test -s projects/03_shotgun_metagenomics/results/CLASSIFIER_COMPARISON.md
          test -s projects/03_shotgun_metagenomics/results/REPORT.md

      - name: Commit verified results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/03_shotgun_metagenomics/results
          if git diff --cached --quiet; then
            echo "No result changes to commit"
          else
            git commit -m "results: add verified shotgun metagenomics analysis"
            git push
          fi

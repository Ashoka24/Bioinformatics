name: 03 - Shotgun metagenomics

on:
  workflow_dispatch:
  push:
    paths:
      - "shotgun-metagenomics/**"
      - ".github/workflows/03-shotgun-metagenomics.yml"

permissions:
  contents: write

jobs:
  shotgun:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fastp kraken2 centrifuge curl

      - name: Run public shotgun analysis
        run: bash shotgun-metagenomics/scripts/run_shotgun.sh

      - name: Verify derived results
        run: |
          test -s shotgun-metagenomics/results/run_metadata.tsv
          test -s shotgun-metagenomics/results/fastp_summary.json
          test -s shotgun-metagenomics/results/kraken2.report
          test -s shotgun-metagenomics/results/top_taxa.tsv
          test -s shotgun-metagenomics/results/centrifuge.report.tsv
          test -s shotgun-metagenomics/results/classifier_comparison.tsv
          test -s shotgun-metagenomics/results/CLASSIFIER_COMPARISON.md
          test -s shotgun-metagenomics/results/REPORT.md
          test ! -e shotgun-metagenomics/results/centrifuge.classification.tsv

      - name: Commit verified results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shotgun-metagenomics/results
          if git diff --cached --quiet; then
            echo "No result changes to commit"
          else
            git commit -m "results: add verified shotgun metagenomics analysis"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                exit 0
              fi
              if [ "$attempt" -lt 3 ]; then
                git fetch origin main
                git rebase origin/main
              fi
            done
            echo "Could not push the shotgun results after three attempts." >&2
            exit 1
          fi

name: Project 02 IBS microbiome

on:
  push:
    paths:
      - '.github/workflows/02-ibs-microbiome.yml'
      - 'projects/02_ibs_microbiome/**'
  workflow_dispatch: {}\n  pull_request:\n    paths:\n      - '.github/workflows/02-ibs-microbiome.yml'\n      - 'projects/02_ibs_microbiome/**'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Pull QIIME 2
        run: docker pull quay.io/qiime2/amplicon:2024.10
      - name: Run public IBS analysis
        run: bash projects/02_ibs_microbiome/scripts/02_run_ibs_analysis.sh
      - name: Commit verified results
        run: |
          set -euo pipefail
          mkdir -p projects/02_ibs_microbiome/results
          cp -R results_actual/. projects/02_ibs_microbiome/results/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/02_ibs_microbiome/results
          git diff --cached --quiet && exit 0
          git commit -m 'results: add actual IBS microbiome outcomes'
          git push

name: Project 02 IBS microbiome

on:
  push:
    paths:
      - '.github/workflows/02-ibs-microbiome.yml'
      - 'ibs-microbiome-ml/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Pull QIIME 2
        run: docker pull quay.io/qiime2/amplicon:2024.10
      - name: Run public IBS analysis
        run: bash ibs-microbiome-ml/scripts/02_run_ibs_analysis.sh
      - name: Commit verified results
        run: |
          set -euo pipefail
          mkdir -p ibs-microbiome-ml/results
          cp -R results_actual/. ibs-microbiome-ml/results/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ibs-microbiome-ml/results
          git diff --cached --quiet && exit 0
          git commit -m 'results: add actual IBS microbiome outcomes'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              git fetch origin main
              git rebase origin/main
            fi
          done
          echo "Could not push the IBS results after three attempts." >&2
          exit 1

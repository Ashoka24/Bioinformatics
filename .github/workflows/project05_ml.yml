name: Project 05 - Bioinformatics ML

on:
  push:
    paths:
      - 'transcriptomics-machine-learning/scripts/**'
      - 'transcriptomics-machine-learning/metadata/**'
      - 'transcriptomics-machine-learning/README.md'
      - '.github/workflows/project05_ml.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: project05-ml-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transcriptomics-ml:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn matplotlib

      - name: Download GEO processed matrix
        run: |
          mkdir -p transcriptomics-machine-learning/data
          curl -L --fail --retry 3             'https://ftp.ncbi.nlm.nih.gov/geo/series/GSE42nnn/GSE42568/matrix/GSE42568_series_matrix.txt.gz'             -o transcriptomics-machine-learning/data/GSE42568_series_matrix.txt.gz
          gzip -t transcriptomics-machine-learning/data/GSE42568_series_matrix.txt.gz

      - name: Run machine-learning analysis
        run: |
          python transcriptomics-machine-learning/scripts/run_ml.py

      - name: Verify required outputs
        run: |
          test -s transcriptomics-machine-learning/results/REPORT.md
          test -s transcriptomics-machine-learning/results/metrics.tsv
          test -s transcriptomics-machine-learning/results/feature_ranking.tsv
          test -s transcriptomics-machine-learning/results/figures/model_performance.png
          test -s transcriptomics-machine-learning/results/figures/model_performance.svg
          test -s transcriptomics-machine-learning/results/figures/roc_curves.png

      - name: Commit current summary outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transcriptomics-machine-learning/results/REPORT.md transcriptomics-machine-learning/results/metrics.tsv transcriptomics-machine-learning/results/feature_ranking.tsv transcriptomics-machine-learning/results/figures/model_performance.svg
          if git diff --cached --quiet; then
            echo "No summary changes to commit"
          else
            git commit -m "results: refresh transcriptomics classification"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                exit 0
              fi
              if [ "$attempt" -lt 3 ]; then
                git fetch origin main
                git rebase origin/main
              fi
            done
            echo "Could not push transcriptomics results after three attempts." >&2
            exit 1
          fi

      - name: Upload Project 05 results
        uses: actions/upload-artifact@v4
        with:
          name: project05-ml-results
          path: |
            transcriptomics-machine-learning/results/
            transcriptomics-machine-learning/data/GSE42568_series_matrix.txt.gz
          retention-days: 90

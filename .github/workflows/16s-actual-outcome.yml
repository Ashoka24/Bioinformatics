name: Project 01 actual 16S outcome
# Results are intentionally committed; raw data and QIIME artifacts remain ignored.

on:
  push:
    paths:
      - '.github/workflows/16s-actual-outcome.yml'
      - '16s-gut-microbiome/scripts/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Pull QIIME 2
        run: docker pull quay.io/qiime2/amplicon:2024.10
      - name: Run actual public sample
        run: bash 16s-gut-microbiome/scripts/07_actual_public_run.sh
      - name: Commit verified results
        run: |
          set -euo pipefail
          mkdir -p 16s-gut-microbiome/results
          cp -R results_actual/. 16s-gut-microbiome/results/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 16s-gut-microbiome/results
          git diff --cached --quiet && exit 0
          git commit -m 'results: add actual SRR26534086 16S outcomes'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              git fetch origin main
              git rebase origin/main
            fi
          done
          echo "Could not push the 16S results after three attempts." >&2
          exit 1
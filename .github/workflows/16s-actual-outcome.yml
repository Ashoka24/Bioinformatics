name: Project 01 actual 16S outcome

on:
  push:
    paths:
      - '.github/workflows/16s-actual-outcome.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUN: SRR26534086
      IMAGE: quay.io/qiime2/amplicon:2024.10
      PROJECT: projects/01_16s_microbiome
    steps:
      - uses: actions/checkout@v4

      - name: Download FASTQ from ENA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/raw
          curl -fsSL --retry 3 "https://www.ebi.ac.uk/ena/portal/api/filereport?accession=$RUN&result=read_run&fields=run_accession,fastq_ftp,fastq_md5,fastq_bytes&format=tsv" > work/ena.tsv
          cat work/ena.tsv
          awk -F'\t' 'NR==2 {print $2}' work/ena.tsv | tr ';' '\n' | while read -r url; do
            f=$(basename "$url")
            curl -fL --retry 3 "https://${url#ftp://}" -o "work/raw/$f"
          done
          ls -lh work/raw

      - name: Pull QIIME 2
        run: docker pull "$IMAGE"

      - name: Import reads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/q2
          cat > work/manifest.tsv <<'EOF'
sample-id	forward-absolute-filepath	reverse-absolute-filepath
SRR26534086	/data/work/raw/SRR26534086_1.fastq.gz	/data/work/raw/SRR26534086_2.fastq.gz
EOF
          docker run --rm -v "$PWD:/data" "$IMAGE" qiime tools import --type 'SampleData[PairedEndSequencesWithQuality]' --input-path /data/work/manifest.tsv --input-format PairedEndFastqManifestPhred33V2 --output-path /data/work/q2/demux.qza
          docker run --rm -v "$PWD:/data" "$IMAGE" qiime demux summarize --i-data /data/work/q2/demux.qza --o-visualization /data/work/q2/demux.qzv

      - name: Trim primers and denoise with DADA2
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/data" "$IMAGE" qiime cutadapt trim-paired --i-demultiplexed-sequences /data/work/q2/demux.qza --p-front-f CCTACGGGNGGCWGCAG --p-front-r GACTACHVGGGTATCTAATCC --p-error-rate 0.1 --p-discard-untrimmed --o-trimmed-sequences /data/work/q2/trimmed.qza --verbose 2>&1 | tee work/cutadapt.log
          docker run --rm -v "$PWD:/data" "$IMAGE" qiime dada2 denoise-paired --i-demultiplexed-seqs /data/work/q2/trimmed.qza --p-trunc-len-f 280 --p-trunc-len-r 260 --p-max-ee-f 2 --p-max-ee-r 2 --p-trunc-q 2 --p-n-threads 2 --o-table /data/work/q2/table.qza --o-representative-sequences /data/work/q2/rep-seqs.qza --o-denoising-stats /data/work/q2/denoising-stats.qza 2>&1 | tee work/dada2.log

      - name: Classify with SILVA 138 99%
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://data.qiime2.org/classifiers/sklearn-1.4.2/silva/silva-138-99-nb-classifier.qza -o work/silva.qza
          echo 'c08a1aa4d56b449b511f7215543a43249ae9c54b57491428a7e5548a62613616  work/silva.qza' | sha256sum -c -
          docker run --rm -v "$PWD:/data" "$IMAGE" qiime feature-classifier classify-sklearn --i-classifier /data/work/silva.qza --i-reads /data/work/q2/rep-seqs.qza --p-n-jobs 2 --o-classification /data/work/q2/taxonomy.qza 2>&1 | tee work/classifier.log

      - name: Export results
        shell: bash
        run: |
          set -euo pipefail
          rm -rf results_actual
          mkdir -p results_actual/qc results_actual/tables results_actual/figures
          for x in denoising-stats table rep-seqs taxonomy; do docker run --rm -v "$PWD:/data" "$IMAGE" qiime tools export --input-path "/data/work/q2/$x.qza" --output-path "/data/results_actual/qc/$x"; done
          docker run --rm -v "$PWD:/data" "$IMAGE" biom convert -i /data/results_actual/qc/table/feature-table.biom -o /data/results_actual/tables/feature-table.tsv --to-tsv
          cp results_actual/qc/taxonomy/taxonomy.tsv results_actual/tables/taxonomy.tsv
          docker run --rm -v "$PWD:/data" "$IMAGE" qiime diversity alpha --i-table /data/work/q2/table.qza --p-metric observed_features --o-alpha-diversity /data/work/q2/observed.qza
          docker run --rm -v "$PWD:/data" "$IMAGE" qiime diversity alpha --i-table /data/work/q2/table.qza --p-metric shannon --o-alpha-diversity /data/work/q2/shannon.qza
          for x in observed shannon; do docker run --rm -v "$PWD:/data" "$IMAGE" qiime tools export --input-path "/data/work/q2/$x.qza" --output-path "/data/results_actual/tables/$x"; done

      - name: Rank-level abundance tables and figures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
from pathlib import Path
import csv, re
root=Path('results_actual')
def rows(p):
    with open(p, newline='') as f: return list(csv.reader(f, delimiter='\t'))
feat=rows(root/'tables/feature-table.tsv'); tax=rows(root/'tables/taxonomy.tsv')
counts={r[0]:int(float(r[1])) for r in feat[1:] if len(r)>1 and r[0] and not r[0].startswith('#')}
taxonomy={r[0]:r[1] for r in tax[1:] if len(r)>1}; labels={2:'phylum',3:'class',4:'order',5:'family',6:'genus',7:'species'}
for level,name in labels.items():
    agg={}
    for fid,c in counts.items():
        parts=[x.strip() for x in taxonomy.get(fid,'Unclassified').split(';')]
        k=parts[level-1] if len(parts)>=level and parts[level-1] else 'Unclassified'
        agg[k]=agg.get(k,0)+c
    total=sum(agg.values())
    with open(root/f'tables/{name}_abundance.tsv','w') as f:
        f.write('taxon\tread_count\trelative_abundance_percent\n')
        for k,v in sorted(agg.items(),key=lambda z:z[1],reverse=True): f.write(f'{k}\t{v}\t{100*v/total if total else 0:.4f}\n')
def svg(name,title):
    p=root/f'tables/{name}_abundance.tsv'; data=[]
    with open(p) as f:
        for r in list(csv.DictReader(f,delimiter='\t'))[:15]: data.append((r['taxon'],float(r['relative_abundance_percent'])))
    m=max([x[1] for x in data] or [1]); H=80+32*len(data); s=[f'<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="{H}"><text x="20" y="30" font-size="20">{title}</text>']
    y=55
    for k,v in data: s += [f'<text x="20" y="{y+15}" font-size="12">{k[:70]}</text>',f'<rect x="450" y="{y}" width="480" height="20" fill="currentColor" transform="scale({v/m if m else 0},1) translate({450*(1-m/v) if v else 0},0)"/><text x="950" y="{y+15}" font-size="12">{v:.2f}%</text>']; y+=32
    s.append('</svg>'); (root/'figures'/f'{name}_relative_abundance.svg').write_text('\n'.join(s))
svg('phylum','SRR26534086 — relative abundance by Phylum'); svg('genus','SRR26534086 — relative abundance by Genus')
obs=rows(root/'tables/observed/alpha-diversity.tsv'); sha=rows(root/'tables/shannon/alpha-diversity.tsv')
report=['# Actual outcome — SRR26534086','', 'Public FASTQ analysis; no private/company data. Single-run workflow validation, not cohort-level inference.','', '## Dataset','- BioSample: `SAMN37943185`','- BioProject: `PRJNA1031545`','- Experiment: `SRX22237515`','- Assay: 16S rRNA V3–V4','- Instrument: Illumina MiSeq','', '## Analysis','- QIIME 2 2024.10 amplicon Docker image','- Cutadapt primer trimming','- DADA2 paired-end; truncation 280/260; max EE 2/2','- SILVA 138 99% full-length Naive Bayes classifier','- Classifier SHA256: `c08a1aa4d56b449b511f7215543a43249ae9c54b57491428a7e5548a62613616`','', '## Files','- `tables/taxonomy.tsv` — ASV taxonomy','- `tables/feature-table.tsv` — ASV counts','- `tables/*_abundance.tsv` — rank-level counts and relative abundance','- `qc/denoising-stats/denoising_stats.tsv` — read retention','- `tables/observed/alpha-diversity.tsv` — observed ASVs','- `tables/shannon/alpha-diversity.tsv` — Shannon diversity','- `figures/phylum_relative_abundance.svg` and `figures/genus_relative_abundance.svg` — rank plots','', 'Beta diversity/PERMANOVA is intentionally omitted because only one sample is analyzed.']
(root/'REPORT.md').write_text('\n'.join(report))
PY

      - name: Commit verified outcomes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROJECT/results"
          cp -R results_actual/. "$PROJECT/results/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$PROJECT/results"
          git diff --cached --quiet && exit 0
          git commit -m 'results: add actual SRR26534086 16S outcomes'
          git push
name: Project 01 actual 16S outcome
# Results are intentionally committed; raw data and QIIME artifacts remain ignored.

on:
  push:
    paths:
      - '16s-gut-microbiome/scripts/**'
      - '16s-gut-microbiome/params/**'
      - '16s-gut-microbiome/docs/**'
      - '16s-gut-microbiome/README.md'
      - '.github/workflows/16s-actual-outcome.yml'
  workflow_dispatch: {}

concurrency:
  group: project01-16s-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Pull QIIME 2
        run: docker pull quay.io/qiime2/amplicon:2024.10
      - name: Run actual public sample
        run: bash 16s-gut-microbiome/scripts/07_actual_public_run.sh
      - name: Upload verified results
        uses: actions/upload-artifact@v4
        with:
          name: project01-16s-results
          path: results_actual/
          if-no-files-found: error
          retention-days: 90
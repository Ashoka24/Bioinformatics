<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">IBS microbiome analysis overview</title>
<desc id="desc">Public 16S re-analysis of 111 samples, including 85 IBS samples and 26 healthy controls.</desc>
<rect width="1200" height="400" rx="20" fill="#ffffff" stroke="#d8e0ea"/>
<rect width="1200" height="112" rx="20" fill="#17324d"/>
<rect y="92" width="1200" height="20" fill="#17324d"/>
<text x="30" y="48" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#ffffff">IBS microbiome analysis</text>
<text x="30" y="80" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#d9e5ef">Public cohort re-analysis · PRJNA637763</text>
<g font-family="Arial,Helvetica,sans-serif">
  <rect x="28" y="136" width="264" height="94" rx="14" fill="#f4f7fb" stroke="#d8e0ea"/>
  <text x="46" y="176" font-size="28" font-weight="700" fill="#17324d">111</text>
  <text x="46" y="205" font-size="15" fill="#526477">Samples analyzed</text>
  <rect x="310" y="136" width="264" height="94" rx="14" fill="#f4f7fb" stroke="#d8e0ea"/>
  <text x="328" y="176" font-size="28" font-weight="700" fill="#17324d">85</text>
  <text x="328" y="205" font-size="15" fill="#526477">IBS samples</text>
  <rect x="592" y="136" width="264" height="94" rx="14" fill="#f4f7fb" stroke="#d8e0ea"/>
  <text x="610" y="176" font-size="28" font-weight="700" fill="#17324d">26</text>
  <text x="610" y="205" font-size="15" fill="#526477">Healthy controls</text>
  <rect x="874" y="136" width="298" height="94" rx="14" fill="#f4f7fb" stroke="#d8e0ea"/>
  <text x="892" y="176" font-size="23" font-weight="700" fill="#17324d">V1–V2</text>
  <text x="892" y="205" font-size="15" fill="#526477">16S rRNA amplicon region</text>
  <text x="28" y="267" font-size="15" font-weight="700" fill="#526477">ANALYSIS WORKFLOW</text>
  <rect x="28" y="286" width="210" height="58" rx="10" fill="#e8f0f7" stroke="#c4d3e0"/>
  <text x="133" y="320" text-anchor="middle" font-size="15" font-weight="600" fill="#24445f">Public SRA reads</text>
  <path d="M 240 315 l 14 0 l -5 -5 m 5 5 l -5 5" fill="none" stroke="#6b8499" stroke-width="2"/>
  <rect x="262" y="286" width="210" height="58" rx="10" fill="#e8f0f7" stroke="#c4d3e0"/>
  <text x="367" y="320" text-anchor="middle" font-size="15" font-weight="600" fill="#24445f">QIIME 2 / Deblur</text>
  <path d="M 474 315 l 14 0 l -5 -5 m 5 5 l -5 5" fill="none" stroke="#6b8499" stroke-width="2"/>
  <rect x="496" y="286" width="210" height="58" rx="10" fill="#e8f0f7" stroke="#c4d3e0"/>
  <text x="601" y="320" text-anchor="middle" font-size="15" font-weight="600" fill="#24445f">Genus features</text>
  <path d="M 708 315 l 14 0 l -5 -5 m 5 5 l -5 5" fill="none" stroke="#6b8499" stroke-width="2"/>
  <rect x="730" y="286" width="210" height="58" rx="10" fill="#e8f0f7" stroke="#c4d3e0"/>
  <text x="835" y="320" text-anchor="middle" font-size="15" font-weight="600" fill="#24445f">Cross-validation</text>
  <path d="M 942 315 l 14 0 l -5 -5 m 5 5 l -5 5" fill="none" stroke="#6b8499" stroke-width="2"/>
  <rect x="964" y="286" width="208" height="58" rx="10" fill="#e8f0f7" stroke="#c4d3e0"/>
  <text x="1068" y="320" text-anchor="middle" font-size="15" font-weight="600" fill="#24445f">Model evaluation</text>
</g>
<text x="1170" y="380" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#718096">Single study cohort · not clinical diagnostic validation</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560"><rect width="1400" height="560" fill="#fff"/><text x="700" y="45" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700">Project 02 — Output / File Map</text><g font-family="monospace" font-size="16"><rect x="80" y="90" width="1240" height="410" rx="16" fill="#f7f7f7" stroke="#222" stroke-width="2"/><text x="115" y="130" font-weight="700">02_ibs_microbiome/</text><text x="145" y="175">├── metadata/ → public cohort provenance</text><text x="145" y="215">├── scripts/ → preprocessing, diversity and ML analysis</text><text x="145" y="255">├── results/</text><text x="180" y="295">│   ├── REPORT.md → verified cohort summary</text><text x="180" y="335">│   ├── tables/ → feature and taxonomic summaries</text><text x="180" y="375">│   ├── figures/ → analysis visualizations</text><text x="180" y="415">│   ├── ml/ → model metrics / predictions</text><text x="180" y="455">│   └── qc/ → quality-control outputs</text><text x="900" y="455" font-family="Arial,sans-serif" font-size="14">Raw FASTQ and QIIME artifacts stay outside Git.</text></g></svg>